<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bảng điều khiển Báo cáo{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="mac-window">
        <div class="mac-titlebar">
            <div class="mac-traffic">
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <div class="mac-title">Trung Tâm Báo Cáo Kinh Doanh</div>
            <div class="mac-search" id="reportSearch">
                <span class="mac-search-ico">🔍</span>
                <input type="text" id="reportSearchInput" autocomplete="off"
                    placeholder="Tìm kiếm báo cáo..." aria-label="Tìm kiếm báo cáo">
                <ul class="mac-search-results" id="reportSearchResults" hidden></ul>
            </div>
        </div>

        <div class="mac-body">
            <nav class="mac-sidebar">
                <div class="mac-brand">
                    <span class="mac-brand-logo">📈</span>
                    <span class="mac-brand-name">FIN DASH</span>
                </div>
                <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' else '' }}">
                    <span class="nav-ico">🏠</span> Trang chủ
                </a>
                <a href="{{ url_for('summary_report') }}" class="{{ 'active' if request.endpoint == 'summary_report' else '' }}">
                    <span class="nav-ico">📋</span> Báo cáo Tổng hợp
                </a>
                <a href="{{ url_for('ranking_report') }}" class="{{ 'active' if request.endpoint == 'ranking_report' else '' }}">
                    <span class="nav-ico">🏆</span> Báo cáo Xếp hạng ASM
                </a>
                <a href="{{ url_for('business_dashboard') }}" class="{{ 'active' if request.endpoint == 'business_dashboard' else '' }}">
                    <span class="nav-ico">📊</span> Báo cáo Kinh doanh
                </a>
                <a href="{{ url_for('asm_evaluation') }}" class="{{ 'active' if request.endpoint == 'asm_evaluation' else '' }}">
                    <span class="nav-ico">🥇</span> Đánh giá ASM
                </a>
                <a href="{{ url_for('business_description') }}" class="{{ 'active' if request.endpoint == 'business_description' else '' }}">
                    <span class="nav-ico">📖</span> Mô Tả Nghiệp Vụ
                </a>
            </nav>

            <main class="mac-main">
                <div class="container">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- Titlebar report search ---
            const searchInput = document.getElementById('reportSearchInput');
            const searchResults = document.getElementById('reportSearchResults');
            if (searchInput && searchResults) {
                const reportIndex = [
                    { title: 'Trang chủ', desc: 'Tổng quan các báo cáo', icon: '🏠', url: '{{ url_for("home") }}', keywords: 'home trang chu chủ' },
                    { title: 'Báo cáo Kinh doanh', desc: 'Dashboard KPI doanh thu - chi phí - lợi nhuận', icon: '📊', url: '{{ url_for("business_dashboard") }}', keywords: 'kinh doanh kpi doanh thu chi phi loi nhuan business dashboard' },
                    { title: 'Báo cáo Tổng hợp', desc: 'Hiệu suất kinh doanh theo khu vực', icon: '📋', url: '{{ url_for("summary_report") }}', keywords: 'tong hop summary khu vuc tonghop' },
                    { title: 'Báo cáo Xếp hạng ASM', desc: 'Xếp hạng chi tiết ASM theo KPI', icon: '🏆', url: '{{ url_for("ranking_report") }}', keywords: 'xep hang ranking asm xephang' },
                    { title: 'Đánh giá ASM', desc: 'Top 10 chỉ số, phân bố ASM theo khu vực', icon: '🥇', url: '{{ url_for("asm_evaluation") }}', keywords: 'danh gia asm evaluation top 10 dangia' },
                    { title: 'Mô Tả Nghiệp Vụ', desc: 'Tài liệu mô tả nghiệp vụ báo cáo', icon: '📖', url: '{{ url_for("business_description") }}', keywords: 'mo ta nghiep vu description business motanghiepvu' },
                ];

                const stripDiacritics = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

                function renderResults(query) {
                    const q = stripDiacritics(query.trim());
                    if (!q) {
                        searchResults.hidden = true;
                        searchResults.innerHTML = '';
                        return;
                    }
                    const matches = reportIndex.filter(item => {
                        const haystack = stripDiacritics(item.title + ' ' + item.desc + ' ' + item.keywords);
                        return haystack.includes(q);
                    });
                    if (matches.length === 0) {
                        searchResults.innerHTML = '<li class="mac-search-empty">Không tìm thấy báo cáo phù hợp</li>';
                    } else {
                        searchResults.innerHTML = matches.map((m, i) =>
                            `<li class="mac-search-item${i === 0 ? ' active' : ''}" data-url="${m.url}">
                                <span class="mac-search-item-ico">${m.icon}</span>
                                <span class="mac-search-item-text">
                                    <span class="mac-search-item-title">${m.title}</span>
                                    <span class="mac-search-item-desc">${m.desc}</span>
                                </span>
                            </li>`
                        ).join('');
                    }
                    searchResults.hidden = false;
                }

                function navigateActive() {
                    const active = searchResults.querySelector('.mac-search-item.active');
                    if (active && active.dataset.url) window.location.href = active.dataset.url;
                }

                function moveActive(delta) {
                    const items = Array.from(searchResults.querySelectorAll('.mac-search-item'));
                    if (items.length === 0) return;
                    const currentIdx = items.findIndex(el => el.classList.contains('active'));
                    const nextIdx = (currentIdx + delta + items.length) % items.length;
                    items.forEach(el => el.classList.remove('active'));
                    items[nextIdx].classList.add('active');
                    items[nextIdx].scrollIntoView({ block: 'nearest' });
                }

                searchInput.addEventListener('input', (e) => renderResults(e.target.value));
                searchInput.addEventListener('focus', (e) => { if (e.target.value) renderResults(e.target.value); });
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); navigateActive(); }
                    else if (e.key === 'ArrowDown') { e.preventDefault(); moveActive(1); }
                    else if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); }
                    else if (e.key === 'Escape') { searchInput.value = ''; renderResults(''); searchInput.blur(); }
                });
                searchResults.addEventListener('mousedown', (e) => {
                    const item = e.target.closest('.mac-search-item');
                    if (item && item.dataset.url) { e.preventDefault(); window.location.href = item.dataset.url; }
                });
                document.addEventListener('click', (e) => {
                    if (!document.getElementById('reportSearch').contains(e.target)) {
                        searchResults.hidden = true;
                    }
                });
            }

            // --- MODIFICATION START: Corrected the button ID from btnApprove to btnSendEmail ---
            const sendEmailButton = document.getElementById('btnSendEmail');
            if (sendEmailButton) {
                sendEmailButton.addEventListener('click', function() {
                    var reportPeriodSelect = document.getElementById('month');
                    if (!reportPeriodSelect) {
                        alert('Không tìm thấy trường chọn tháng báo cáo!');
                        return;
                    }
                    var reportPeriod = reportPeriodSelect.value;
                    
                    // --- MODIFICATION START: Corrected the input ID from supervisorEmail to recipientEmail ---
                    var emailInput = document.getElementById('recipientEmail');
                    
                    if (!emailInput) {
                        alert('Không tìm thấy trường nhập email!');
                        return;
                    }
                    var email = emailInput.value;
                    
                    if(!email || !email.includes('@')) {
                        alert('Vui lòng nhập địa chỉ email hợp lệ!');
                        return;
                    }
                    
                    showLoading('Đang tạo báo cáo và gửi email. Vui lòng chờ đợi...');
                    
                    fetch('/send-approval-email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            report_period: reportPeriod,
                            email: email
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        hideLoading();
                        if (data.status === 'success') {
                            var successMessage = data.message;
                            if (data.google_drive_link) {
                                successMessage += '\n\nBạn có thể xem báo cáo tại: ' + data.google_drive_link;
                            }
                            
                            if (confirm(successMessage + '\n\nBạn có muốn mở Google Drive ngay bây giờ?')) {
                                window.open(data.google_drive_link, '_blank');
                            }
                            
                            // --- MODIFICATION START: Clear the correct input field ---
                            document.getElementById('recipientEmail').value = '';
                        } else {
                            alert('Lỗi: ' + data.message);
                        }
                    })
                    .catch(error => {
                        hideLoading();
                        console.error('Error:', error);
                        alert('Có lỗi xảy ra khi gửi email phê duyệt.');
                    });
                });
            }
        });

        function showLoading(message) {
            hideLoading();
            
            var overlay = document.createElement('div');
            overlay.id = 'loadingOverlay';
            overlay.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000;';
            
            var loadingBox = document.createElement('div');
            loadingBox.style.cssText = 'background-color: white; padding: 20px; border-radius: 8px; text-align: center; max-width: 400px;';
            
            var spinner = document.createElement('div');
            spinner.style.cssText = 'border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; width: 50px; height: 50px; margin: 0 auto 15px; animation: spin 2s linear infinite;';
            
            var messageElement = document.createElement('p');
            messageElement.textContent = message || 'Đang xử lý...';
            messageElement.style.cssText = 'margin: 0; font-size: 16px;';
            
            loadingBox.appendChild(spinner);
            loadingBox.appendChild(messageElement);
            overlay.appendChild(loadingBox);
            document.body.appendChild(overlay);
            
            if (!document.getElementById('spinnerAnimation')) {
                var style = document.createElement('style');
                style.id = 'spinnerAnimation';
                style.textContent = `
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                `;
                document.head.appendChild(style);
            }
        }

        function hideLoading() {
            var overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.remove();
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
