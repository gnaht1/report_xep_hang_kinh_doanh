<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng điều khiển Báo cáo</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .container { max-width: 1600px; margin: auto; }
        h1, h2 { color: #333; }
        .controls { margin-bottom: 20px; }
        .report { margin-top: 30px; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        #btnApprove {
            background-color: #4CAF50; color: white; padding: 10px 20px;
            border: none; border-radius: 5px; cursor: pointer; font-size: 16px;
            margin-top: 20px;
        }
        #btnApprove:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bảng điều khiển Báo cáo</h1>

        <div class="controls">
            <form action="/" method="get">
                <label for="month">Chọn tháng báo cáo:</label>
                <select name="month" id="month" onchange="this.form.submit()">
                    {% for month in months %}
                        <option value="{{ month.value }}" {% if month.value == selected_month %}selected{% endif %}>
                            {{ month.text }}
                        </option>
                    {% endfor %}
                </select>
                <noscript><input type="submit" value="Xem"></noscript>
            </form>
        </div>

        <div class="report">
            <h2>Báo cáo Tổng hợp (Kỳ: {{ selected_month }})</h2>
            <!-- Super header chạy từ cột 2 đến 6 trong 14 cột, không bị che khuất -->
        <div style="display: flex; width: 100%; margin-bottom: 0; align-items: center;">
    <div style="flex:1"></div>
    <div style="
        flex:5;
        background: #47a6f5;
        text-align: center;
        font-weight: bold;
        font-size: 18px;
        border-radius: 6px 6px 0 0;
        color: white;
        border: 2px solid #47a6f5;
        border-bottom: none;
        box-shadow: 0 2px 6px rgba(255,200,50,0.08);
        letter-spacing: 0.5px;
        padding: 8px 0 4px 0;
        ">
        Tổng cần phân bổ xuống cho ĐVML
    </div>
    <div style="flex:8"></div>
</div>


            <div id="summaryGraph"></div>
        </div>

        <div class="report">
            <h2>Báo cáo Xếp hạng ASM (Kỳ: {{ selected_month }})</h2>
            <div id="rankingGraph"></div>
        </div>

        <button id="btnApprove">Phê duyệt & Gửi Email</button>
    </div>

    <script>
        // Hiển thị biểu đồ
        var summaryData = {{ summary_graph_json|safe }};
        if (summaryData) {
            Plotly.newPlot('summaryGraph', summaryData.data, summaryData.layout || {});
        } else {
            document.getElementById('summaryGraph').innerHTML = '<p>Không có dữ liệu cho kỳ báo cáo này.</p>';
        }


        var rankingData = {{ ranking_graph_json|safe }};
        if(rankingData) {
            Plotly.newPlot('rankingGraph', rankingData.data, rankingData.layout || {});
        } else {
            document.getElementById('rankingGraph').innerHTML = '<p>Không có dữ liệu cho kỳ báo cáo này.</p>';
        }


        // Xử lý sự kiện bấm nút
        document.getElementById('btnApprove').addEventListener('click', function() {
            var reportPeriod = document.getElementById('month').value;
            if (confirm('Bạn có chắc muốn phê duyệt và gửi email báo cáo cho kỳ ' + reportPeriod + '?')) {
                fetch('/send-approval-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ report_period: reportPeriod })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') {
                        alert('Thành công! ' + data.message);
                    } else {
                        alert('Lỗi: ' + data.message);
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        });
    </script>
</body>
</html>
