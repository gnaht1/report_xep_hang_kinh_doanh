<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng điều khiển Báo cáo</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .container { max-width: 1600px; margin: auto; }
        h1, h2 { color: #333; }
        .controls { margin-bottom: 20px; }
        .report { margin-top: 30px; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        #btnApprove {
            background-color: #4CAF50; color: white; padding: 10px 20px;
            border: none; border-radius: 5px; cursor: pointer; font-size: 16px;
            margin-top: 20px;
        }
        #btnApprove:hover { background-color: #45a049; }
    </style>

    <style>
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th,
        .summary-table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .summary-table thead th {
            background-color: paleturquoise;
            font-weight: bold;
        }
        .summary-table .header-blue {
            background-color: #007acc !important;
            color: white !important;
            font-weight: bold;
        }
        
        .summary-table .column-yellow {
            background-color: #f7fc4b !important;
        }
        
        .summary-table .cell-blue {
            background-color: #73b3eeff !important;
            font-weight: bold;
        }
        .summary-table .cell-yellow {
            background-color: #e0a80dff !important;
            font-weight: bold;
        }
        .summary-table .cell-orange {
            background-color: #e05b08ff !important;
            font-weight: bold;
        }
        .summary-table .cell-green {
            background-color: #0fa814ff !important;
            font-weight: bold;
        }
        .summary-table .cell-gray {
            background-color: #d3d3d3 !important;
            font-weight: bold;
        }
        .summary-table .cell-light-gray {
            background-color: #f0f0f0 !important;
        }
        .summary-table .cell-light-yellow {
            background-color: #f0f1d0ff !important;
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .ranking-table th,
        .ranking-table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .ranking-table thead th {
            background-color: #f0f0f0;
            font-weight: bold;
        }
        .ranking-table .rank-green {
            background-color: #28a745 !important;
            color: white !important;
            font-weight: bold !important;
        }
        .ranking-table .rank-bold {
            font-weight: bold !important;
        }
        .ranking-table .diem-header {
            background-color: #bce9ff !important;
            font-weight: bold !important;
        }
        .ranking-table .tong-diem-cell {
            
            font-weight: bold !important;
        }
        .ranking-table .tong-diem-header {
            background-color: #E2EFD9 !important;
            font-weight: bold !important;
        }
        .ranking-table .rank-final-header {
            background-color: #007acc !important;
            color: white !important;
            font-weight: bold !important;
        }
        .ranking-table .rank-final-cell {
            font-weight: bold !important;
        }
    </style>

</head>
<body>
    <div class="container">
        <h1>Bảng điều khiển Báo cáo</h1>

        <div class="controls">
            <form action="/" method="get">
                <label for="month">Chọn tháng báo cáo:</label>
                <select name="month" id="month" onchange="this.form.submit()">
                    {% for month in months %}
                        <option value="{{ month.value }}" {% if month.value == selected_month %}selected{% endif %}>
                            {{ month.text }}
                        </option>
                    {% endfor %}
                </select>
                <noscript><input type="submit" value="Xem"></noscript>
            </form>
        </div>

        <div class="report">
            <h2>Báo cáo Tổng hợp (Kỳ: {{ selected_month }})</h2>
            <!-- insert the HTML table with superheaders -->
            {{ summary_table_html|safe }}
        </div>

        <div class="report">
            <h2>Báo cáo Xếp hạng ASM (Kỳ: {{ selected_month }})</h2>
            {{ ranking_table_html|safe }}
        </div>

        <div class="approval-section" style="margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; background-color: #f9f9f9;">
            <h3>Phê duyệt và Gửi Email</h3>
            <div style="margin-bottom: 15px;">
                <label for="supervisorEmail" style="display: block; margin-bottom: 5px; font-weight: bold;">Email cấp trên:</label>
                <input type="email" id="supervisorEmail" style="width: 300px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;" 
                       placeholder="Nhập email cấp trên..." required>
            </div>
            <button id="btnApprove">Phê duyệt & Gửi Email</button>
        </div>
    </div>

    <script>
        // Add loading indicator styles
        function showLoading(message) {
            // Create loading overlay if it doesn't exist
            if (!document.getElementById('loadingOverlay')) {
                var overlay = document.createElement('div');
                overlay.id = 'loadingOverlay';
                overlay.style.position = 'fixed';
                overlay.style.top = '0';
                overlay.style.left = '0';
                overlay.style.width = '100%';
                overlay.style.height = '100%';
                overlay.style.backgroundColor = 'rgba(0,0,0,0.5)';
                overlay.style.display = 'flex';
                overlay.style.justifyContent = 'center';
                overlay.style.alignItems = 'center';
                overlay.style.zIndex = '1000';
                
                var loadingBox = document.createElement('div');
                loadingBox.style.backgroundColor = 'white';
                loadingBox.style.padding = '20px';
                loadingBox.style.borderRadius = '8px';
                loadingBox.style.textAlign = 'center';
                loadingBox.style.maxWidth = '400px';
                
                var spinner = document.createElement('div');
                spinner.style.border = '5px solid #f3f3f3';
                spinner.style.borderTop = '5px solid #3498db';
                spinner.style.borderRadius = '50%';
                spinner.style.width = '50px';
                spinner.style.height = '50px';
                spinner.style.margin = '0 auto 15px';
                spinner.style.animation = 'spin 2s linear infinite';
                
                var messageElement = document.createElement('p');
                messageElement.id = 'loadingMessage';
                messageElement.textContent = message || 'Đang xử lý...';
                
                // Add keyframe animation
                var style = document.createElement('style');
                style.textContent = '@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }';
                document.head.appendChild(style);
                
                loadingBox.appendChild(spinner);
                loadingBox.appendChild(messageElement);
                overlay.appendChild(loadingBox);
                document.body.appendChild(overlay);
            } else {
                document.getElementById('loadingMessage').textContent = message || 'Đang xử lý...';
                document.getElementById('loadingOverlay').style.display = 'flex';
            }
        }
        
        function hideLoading() {
            var overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }
        
        // Handle approval button click
        document.getElementById('btnApprove').addEventListener('click', function() {
            var reportPeriod = document.getElementById('month').value;
            var email = document.getElementById('supervisorEmail').value;
            
            // Validate email
            if(!email || !email.includes('@')) {
                alert('Vui lòng nhập địa chỉ email hợp lệ!');
                return;
            }
            
            if (confirm('Bạn có chắc muốn phê duyệt và gửi email báo cáo cho kỳ ' + reportPeriod + '?')) {
                // Show loading indicator - this may take some time
                showLoading('Đang tạo báo cáo và gửi email. Vui lòng chờ đợi...');
                
                // Send approval request with email and report period
                fetch('/send-approval-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        report_period: reportPeriod,
                        email: email 
                    })
                })
                .then(response => response.json())
                .then(data => {
                    // Hide loading indicator
                    hideLoading();
                    
                    if(data.status === 'success') {
                        alert('Thành công! ' + data.message);
                    } else {
                        alert('Lỗi: ' + data.message);
                    }
                })
                .catch(error => {
                    // Hide loading indicator on error
                    hideLoading();
                    console.error('Error:', error);
                    alert('Đã xảy ra lỗi khi xử lý yêu cầu.');
                });
            }
        });
    </script>
</body>
</html>
