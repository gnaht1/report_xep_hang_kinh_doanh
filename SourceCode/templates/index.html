<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng điều khiển Báo cáo</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .container { max-width: 1600px; margin: auto; }
        h1, h2 { color: #333; }
        .controls { margin-bottom: 20px; }
        .report { margin-top: 30px; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
        #btnApprove {
            background-color: #4CAF50; color: white; padding: 10px 20px;
            border: none; border-radius: 5px; cursor: pointer; font-size: 16px;
            margin-top: 20px;
        }
        #btnApprove:hover { background-color: #45a049; }
    </style>

    <style>
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .summary-table th,
        .summary-table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .summary-table thead th {
            background-color: paleturquoise;
            font-weight: bold;
        }
        .summary-table .header-blue {
            background-color: #007acc !important;
            color: white !important;
            font-weight: bold;
        }
        
        .summary-table .column-yellow {
            background-color: #f7fc4b !important;
        }
        
        .summary-table .cell-blue {
            background-color: #73b3eeff !important;
            font-weight: bold;
        }
        .summary-table .cell-yellow {
            background-color: #e0a80dff !important;
            font-weight: bold;
        }
        .summary-table .cell-orange {
            background-color: #e05b08ff !important;
            font-weight: bold;
        }
        .summary-table .cell-green {
            background-color: #0fa814ff !important;
            font-weight: bold;
        }
        .summary-table .cell-gray {
            background-color: #d3d3d3 !important;
            font-weight: bold;
        }
        .summary-table .cell-light-gray {
            background-color: #f0f0f0 !important;
        }
        .summary-table .cell-light-yellow {
            background-color: #f0f1d0ff !important;
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .ranking-table th,
        .ranking-table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .ranking-table thead th {
            background-color: #f0f0f0;
            font-weight: bold;
        }
    </style>

</head>
<body>
    <div class="container">
        <h1>Bảng điều khiển Báo cáo</h1>

        <div class="controls">
            <form action="/" method="get">
                <label for="month">Chọn tháng báo cáo:</label>
                <select name="month" id="month" onchange="this.form.submit()">
                    {% for month in months %}
                        <option value="{{ month.value }}" {% if month.value == selected_month %}selected{% endif %}>
                            {{ month.text }}
                        </option>
                    {% endfor %}
                </select>
                <noscript><input type="submit" value="Xem"></noscript>
            </form>
        </div>

        <div class="report">
            <h2>Báo cáo Tổng hợp (Kỳ: {{ selected_month }})</h2>
            <!-- insert the HTML table with superheaders -->
            {{ summary_table_html|safe }}
        </div>

        <div class="report">
            <h2>Báo cáo Xếp hạng ASM (Kỳ: {{ selected_month }})</h2>
            {{ ranking_table_html|safe }}
        </div>

        <button id="btnApprove">Phê duyệt & Gửi Email</button>
    </div>

    <script>
        // Xử lý sự kiện bấm nút
        document.getElementById('btnApprove').addEventListener('click', function() {
            var reportPeriod = document.getElementById('month').value;
            if (confirm('Bạn có chắc muốn phê duyệt và gửi email báo cáo cho kỳ ' + reportPeriod + '?')) {
                fetch('/send-approval-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ report_period: reportPeriod })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') {
                        alert('Thành công! ' + data.message);
                    } else {
                        alert('Lỗi: ' + data.message);
                    }
                })
                .catch(error => console.error('Error:', error));
            }
        });
    </script>
</body>
</html>
